<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyChat</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Login / Register -->
    <div id="login">
      <form id="authForm" class="login-box">
        <h1>MyChat</h1>
        <input id="username" placeholder="Username" maxlength="20" autocomplete="username" />
        <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
        <div id="authError" class="error"></div>
        <button type="submit">Log in</button>
        <button type="button" id="registerBtn" class="secondary">Create account</button>
      </form>
    </div>

    <div id="app" class="hidden">
      <!-- Left: my contacts -->
      <aside id="sidebar">
        <header>
          <div class="avatar" id="myAvatar"></div>
          <div class="title" id="myName"></div>
          <button id="logoutBtn" class="icon-btn" title="Log out">⎋</button>
        </header>
        <form id="addForm">
          <input id="addInput" placeholder="Add contact (username)" autocomplete="off" />
          <button type="submit">+</button>
        </form>
        <div id="addError" class="error"></div>
        <ul id="contactList"></ul>
      </aside>

      <!-- Right: the open chat -->
      <section id="chat">
        <div id="emptyChat" class="empty">Select a contact to start chatting</div>
        <div id="chatView" class="hidden">
          <header>
            <button id="backBtn" class="icon-btn back">←</button>
            <div class="avatar" id="chatAvatar"></div>
            <div>
              <div class="title" id="chatName"></div>
              <div class="status" id="chatStatus"></div>
              <div class="call-buttons">
                <button id ="voiceCallBtn" class="icon-btn" title="Voice Call"></button>
                <button id="videoCallBtn" class="icon-btn" title="Video Call"></button>
            </div>
          </header>
          <main id="messages"></main>
          <form id="form">
            <label for="fileInput" class="attach" title="Send file">📎</label>
            <input type="file" id="fileInput" hidden />
            <input id="input" placeholder="Message" autocomplete="off" />
            <button type="submit">➤</button>
          </form>
        </div>
      </section>
    </div>

    <div id="callScreen" class="hidden">
      <video id="remoteVideo" autoplay playsinline></video>
      <video id="localVideo" autoplay playsinline muted></video>
      <div class="call-info">
        <div class="call-avatar" id="callAvatar"></div>
        <div class="call-name" id="callName"></div>
        <div class="call-status" id="callStatus"></div>
      </div>
      <div class="call-controls">
        <button id="acceptBtn" class="call-btn accept" title="Accept"></button>
        <button id="muteBtn" class="call-btn" title="Mute"></button>
        <button id="hangupBtn" class="call-btn hangup" title="Hang up"></button>
      </div>
    </div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="app.js"></script>
    <script src="call.js"></script>
  </body>
</html>
